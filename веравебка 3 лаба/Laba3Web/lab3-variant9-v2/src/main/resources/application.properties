server.port=${SERVER_PORT:8080}
spring.application.name=electronics-store

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/electronics_store}
spring.datasource.username=${DB_USERNAME:store}
spring.datasource.password=${DB_PASSWORD:store}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway (code-first миграции) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-32b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Тестовые пользователи (создаются при первом запуске) ---
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.user-password=${SEED_USER_PASSWORD:user123}

# --- Swagger UI ---
springdoc.swagger-ui.operationsSorter=method
