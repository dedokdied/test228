services:
  postgres:
    image: postgres:16-alpine
    container_name: electronics-store-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electronics_store}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electronics-store-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-electronics_store}
      DB_USERNAME: ${POSTGRES_USER:-store}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-store}
      JWT_SECRET: ${JWT_SECRET:-docker-compose-secret-key-change-me-32bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-user123}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
